name: Verify upgrade-safe UI migration

on:
  push:
    branches:
      - chore/upgrade-safe-ring0ledger-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests when present
        run: npm test -- --passWithNoTests
      - name: Build site
        run: npm run build
